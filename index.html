<style>
  :root { --brand: #81002b; --ink: #231714; --muted: #6f6566; --line: #e5d9da; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #f6f2f1; color: var(--ink);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; }
  .box { width: min(420px, calc(100% - 32px)); background: #fff; border-top: 6px solid var(--brand);
    border-radius: 16px; box-shadow: 0 10px 30px #0002; padding: 28px 28px 24px; text-align: center; }
  .box img { height: 110px; }
  h1 { margin: 12px 0 2px; font-size: 1.6rem; letter-spacing: -0.03em; }
  .eng { margin: 0 0 18px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.22em; color: #717071; }
  p.msg { margin: 0 0 14px; color: var(--muted); }
  input { width: 100%; padding: 13px 14px; font: inherit; font-size: 1.15rem; border: 2px solid var(--line);
    border-radius: 10px; text-align: center; }
  input:focus { outline: none; border-color: var(--brand); }
  button { margin-top: 12px; width: 100%; padding: 12px; font: inherit; font-size: 1.1rem; font-weight: 800;
    color: #fff; background: var(--brand); border: 0; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { min-height: 1.4em; margin: 10px 0 0; color: #c41e3a; font-weight: 700; }
  label.keep { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 12px;
    font-size: 0.9rem; color: var(--muted); }
</style>
</head>

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA)); // 암호가 틀리면 여기서 실패
  const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
// 「다시 묻지 않기」 — 암호가 아니라 만든 열쇠를 이 탭(sessionStorage)에만 둔다
const SAVED = 'wawoo3d-key:' + SALT;
(async () => {
  try {
    const raw = sessionStorage.getItem(SAVED);
    if (raw) await open(await crypto.subtle.importKey('raw', bytes(raw), 'AES-GCM', false, ['decrypt']));
  } catch { try { sessionStorage.removeItem(SAVED); } catch {} }
})();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  if (!window.crypto?.subtle || !window.DecompressionStream) { err.textContent = '이 브라우저에서는 열 수 없어요. 크롬·엣지·사파리 최신판을 써 주세요.'; return; }
  go.disabled = true; go.textContent = '여는 중…'; err.textContent = '';
  try {
    const key = await keyFrom(pw.value);
    if (document.getElementById('keep').checked) {
      try { sessionStorage.setItem(SAVED, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch {}
    }
    await open(key);
  } catch {
    err.textContent = '암호가 맞지 않아요.';
    go.disabled = false; go.textContent = '열기'; pw.select();
  }
});
</script>
